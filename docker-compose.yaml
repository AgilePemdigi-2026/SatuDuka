
services:
  satuduka:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      APP_NAME: SatuDuka
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?}
      SATUDUKA_NIK_HASH_KEY: ${SATUDUKA_NIK_HASH_KEY:?}
      APP_URL: ${APP_URL:?}
      ASSET_URL: ${APP_URL:?}

      # Analisis dokumen berbantuan AI. DEEPSEEK_API_KEY wajib diisi di
      # environment server (Coolify); tidak boleh ditulis di berkas ini.
      AI_DRIVER: ${AI_DRIVER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.aivokey.dev/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4.1-flash}
      AI_TIMEOUT: ${AI_TIMEOUT:-90}

      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/app/satuduka.sqlite
      DB_SQLITE_DATABASE: /var/www/html/storage/app/satuduka.sqlite

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr

    volumes:
      - satuduka_data:/var/www/html/storage/app

    expose:
      - "80"

    command: >
      sh -c "touch /var/www/html/storage/app/satuduka.sqlite &&
             chown -R www-data:www-data /var/www/html/storage/app &&
             php artisan migrate --force &&
             exec apache2-foreground"

volumes:
  satuduka_data:
